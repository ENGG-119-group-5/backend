name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      neo4j:
        image: neo4j:5
        env:
          # Same placeholder password as the committed .env (not a secret).
          NEO4J_AUTH: neo4j/your_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p your_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: your_password
      REQUIRE_NEO4J: "1"   # API tests must run here, not skip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Load test fixtures into Neo4j
        run: |
          python src/load_to_neo4j.py schema
          python src/load_to_neo4j.py tto tests/fixtures/technologies_life_sciences.json
          python src/load_to_neo4j.py patents tests/fixtures/uspto_patents_test.json
          python src/link_v1.py tests/fixtures/technologies_life_sciences.json \
            tests/fixtures/uspto_patents_test.json -o "$RUNNER_TEMP/links.json" --neo4j

      - name: Tests
        run: pytest -rs
